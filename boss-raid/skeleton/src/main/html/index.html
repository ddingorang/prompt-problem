<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보스 공략 게임</title>
  <style>
    body { display: flex; flex-direction: column; align-items: center; font-family: sans-serif; background: #f0f0f0; }
    canvas { background: #222; border-radius: 8px; margin-top: 12px; }
    #hp { font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <canvas id="game" width="400" height="500"></canvas>
  <p id="hp">보스 HP: 20 / 20</p>
  <p>← → 방향키로 이동, 스페이스바로 발사하세요. (화면을 클릭한 뒤 조작)</p>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const hpEl = document.getElementById('hp');
    const player = { x: 180, y: 460, w: 40, h: 20, speed: 6 };
    const boss = { x: 150, y: 60, w: 100, h: 40, speed: 1.2, hp: 20, maxHp: 20 };
    let bullets = [];
    let cleared = false;
    const keys = {};

    // SVG 문자열을 그대로 이미지로 만들어 쓴다. 외부 파일이 필요 없다.
    function sprite(svg) {
      const image = new Image();
      image.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
      return image;
    }

    const playerImage = sprite('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="20" viewBox="0 0 40 20"><path d="M20 0 L33 20 L7 20 Z" fill="#4ade80"/><rect x="0" y="11" width="11" height="9" rx="3" fill="#22c55e"/><rect x="29" y="11" width="11" height="9" rx="3" fill="#22c55e"/><circle cx="20" cy="13" r="3.5" fill="#0f172a"/></svg>');
    const bossImage = sprite('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="40" viewBox="0 0 100 40"><rect x="8" y="4" width="84" height="24" rx="11" fill="#a78bfa"/><rect x="0" y="12" width="14" height="17" rx="5" fill="#7c3aed"/><rect x="86" y="12" width="14" height="17" rx="5" fill="#7c3aed"/><rect x="28" y="27" width="44" height="10" rx="5" fill="#8b5cf6"/><circle cx="35" cy="15" r="6" fill="#0f172a"/><circle cx="65" cy="15" r="6" fill="#0f172a"/><circle cx="35" cy="15" r="2.4" fill="#f87171"/><circle cx="65" cy="15" r="2.4" fill="#f87171"/></svg>');
    const bulletImage = sprite('<svg xmlns="http://www.w3.org/2000/svg" width="4" height="12" viewBox="0 0 4 12"><rect width="4" height="12" rx="2" fill="#fbbf24"/><rect x="1.2" y="2" width="1.6" height="8" rx="0.8" fill="#fef08a"/></svg>');

    document.addEventListener('keydown', event => {
      keys[event.key] = true;
      if (event.key !== ' ') return;
      event.preventDefault();
      if (event.repeat || cleared) return;
      bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 12, speed: 10 });
    });
    document.addEventListener('keyup', event => { keys[event.key] = false; });

    function loop() {
      if (cleared) {
        ctx.fillStyle = 'white';
        ctx.font = '30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('보스 격파!', 200, 250);
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (keys.ArrowLeft) player.x -= player.speed;
      if (keys.ArrowRight) player.x += player.speed;
      player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

      boss.x += boss.speed;
      if (boss.x <= 0 || boss.x + boss.w >= canvas.width) boss.speed = -boss.speed;
      boss.x = Math.max(0, Math.min(canvas.width - boss.w, boss.x));

      ctx.fillStyle = '#f87171';
      ctx.fillRect(20, 24, 360 * (boss.hp / boss.maxHp), 12);
      ctx.strokeStyle = '#ffffff';
      ctx.strokeRect(20, 24, 360, 12);

      ctx.drawImage(bossImage, boss.x, boss.y, boss.w, boss.h);
      ctx.drawImage(playerImage, player.x, player.y, player.w, player.h);

      bullets.forEach(bullet => {
        bullet.y -= bullet.speed;
        ctx.drawImage(bulletImage, bullet.x, bullet.y, bullet.w, bullet.h);
        if (bullet.x < boss.x + boss.w && bullet.x + bullet.w > boss.x && bullet.y < boss.y + boss.h && bullet.y + bullet.h > boss.y) {
          bullet.used = true;
          boss.hp -= 1;
        }
      });
      bullets = bullets.filter(bullet => !bullet.used && bullet.y + bullet.h > 0);

      if (boss.hp <= 0) {
        boss.hp = 0;
        cleared = true;
      }
      hpEl.textContent = `보스 HP: ${boss.hp} / ${boss.maxHp}`;
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
