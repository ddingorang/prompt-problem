<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>연쇄 폭발 게임</title>
  <style>
    body { display: flex; flex-direction: column; align-items: center; font-family: sans-serif; background: #f0f0f0; }
    canvas { background: #222; border-radius: 8px; margin-top: 12px; cursor: crosshair; }
    #result { font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <canvas id="game" width="400" height="500"></canvas>
  <p id="result">터뜨린 점: 0 / 70</p>
  <p>화면을 클릭해서 폭발을 일으키세요. (기회는 한 번)</p>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const resultEl = document.getElementById('result');
    const DOT_COUNT = 70;
    const DOT_RADIUS = 7;
    const BLAST_RADIUS = 55;
    const BLAST_LIFE = 90;
    let dots = [];
    let blast = null;
    let popped = 0;
    let started = false;
    let finished = false;

    function reset() {
      dots = [];
      for (let i = 0; i < DOT_COUNT; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.6 + Math.random() * 1.2;
        dots.push({
          x: DOT_RADIUS + Math.random() * (canvas.width - DOT_RADIUS * 2),
          y: DOT_RADIUS + Math.random() * (canvas.height - DOT_RADIUS * 2),
          r: DOT_RADIUS,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          hue: Math.floor(Math.random() * 360)
        });
      }
      blast = null;
      popped = 0;
      started = false;
      finished = false;
    }

    canvas.addEventListener('click', event => {
      if (finished) { reset(); return; }
      if (started) return;
      const bounds = canvas.getBoundingClientRect();
      started = true;
      blast = { x: event.clientX - bounds.left, y: event.clientY - bounds.top, life: 0 };
    });

    // 폭발은 커졌다가 잠시 머문 뒤 줄어들며 사라진다.
    function blastRadius(life) {
      if (life < 30) return BLAST_RADIUS * (life / 30);
      if (life < 60) return BLAST_RADIUS;
      return BLAST_RADIUS * (1 - (life - 60) / 30);
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      dots.forEach(dot => {
        dot.x += dot.vx;
        dot.y += dot.vy;
        if (dot.x - dot.r < 0 || dot.x + dot.r > canvas.width) dot.vx = -dot.vx;
        if (dot.y - dot.r < 0 || dot.y + dot.r > canvas.height) dot.vy = -dot.vy;
        ctx.fillStyle = `hsl(${dot.hue}, 70%, 58%)`;
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, dot.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `hsl(${dot.hue}, 90%, 78%)`;
        ctx.beginPath();
        ctx.arc(dot.x - dot.r * 0.3, dot.y - dot.r * 0.3, dot.r * 0.35, 0, Math.PI * 2);
        ctx.fill();
      });

      if (blast) {
        blast.life += 1;
        const radius = blastRadius(blast.life);
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(blast.x, blast.y, radius, 0, Math.PI * 2);
        ctx.stroke();

        const dotCount = dots.length;
        dots = dots.filter(dot => Math.hypot(dot.x - blast.x, dot.y - blast.y) > radius + dot.r);
        popped += dotCount - dots.length;

        if (blast.life >= BLAST_LIFE) {
          blast = null;
          finished = true;
        }
      }

      if (finished) {
        ctx.fillStyle = 'white';
        ctx.textAlign = 'center';
        ctx.font = '28px sans-serif';
        ctx.fillText(`${popped}개 터뜨림!`, 200, 240);
        ctx.font = '16px sans-serif';
        ctx.fillText('클릭하면 다시 시작', 200, 276);
      }

      resultEl.textContent = `터뜨린 점: ${popped} / ${DOT_COUNT}`;
      requestAnimationFrame(loop);
    }

    reset();
    loop();
  </script>
</body>
</html>
