<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블록 피하기 게임</title>
  <style>
    body { display: flex; flex-direction: column; align-items: center; font-family: sans-serif; background: #f0f0f0; }
    canvas { background: #222; border-radius: 8px; margin-top: 12px; }
    #score { font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <canvas id="game" width="400" height="500"></canvas>
  <p id="score">점수: 0</p>
  <p>← → 방향키로 이동하세요. (화면을 클릭한 뒤 조작)</p>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const player = { x: 180, y: 460, w: 40, h: 20, speed: 6 };
    let blocks = [];
    let score = 0;
    let gameOver = false;
    const keys = {};

    document.addEventListener('keydown', event => { keys[event.key] = true; });
    document.addEventListener('keyup', event => { keys[event.key] = false; });

    function spawnBlock() {
      blocks.push({ x: Math.random() * 370, y: -30, w: 30, h: 30, speed: 2 + Math.random() * 3 });
    }

    setInterval(spawnBlock, 700);

    function loop() {
      if (gameOver) {
        ctx.fillStyle = 'white';
        ctx.font = '30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('게임 오버!', 200, 250);
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (keys.ArrowLeft) player.x -= player.speed;
      if (keys.ArrowRight) player.x += player.speed;
      player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

      ctx.fillStyle = '#4ade80';
      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillStyle = '#f87171';
      blocks.forEach(block => {
        block.y += block.speed;
        ctx.fillRect(block.x, block.y, block.w, block.h);
        if (block.x < player.x + player.w && block.x + block.w > player.x && block.y < player.y + player.h && block.y + block.h > player.y) gameOver = true;
      });

      const blockCount = blocks.length;
      blocks = blocks.filter(block => block.y < canvas.height);
      score += blockCount - blocks.length;
      scoreEl.textContent = `점수: ${score}`;
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
